name: lint
on: 
  push:
jobs:
  main:
    runs-on: [self-hosted, c8g.medium]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: bun ci
      - run: bun run lint
